# T-010 — gitleaks configuration. Extends the built-in default rules; nothing
# is disabled globally.
title = "Smart Clinic gitleaks configuration"

[extend]
useDefault = true

# Existing narrow allowlist: synthetic JWT fixtures in T-007 tests.
[[allowlists]]
description = "Synthetic JWT fixtures in the T-007 log-redaction tests"
condition = "AND"
targetRules = ["jwt"]
paths = ['''backend/tests/SmartClinic\.Api\.Tests/(LogRedactorTests|RequestLoggingTests)\.cs''']
regexes = ['''eyJhbGciOiJIUzI1NiJ9\.eyJ[A-Za-z0-9_-]+\.c2lnbmF0dXJl''']

# T-010: narrowly scoped synthetic fixtures from the original test commit.
# Requires the exact commit, exact test file, a listed rule, and a matching line.
[[allowlists]]
description = "Synthetic redaction fixtures in AuditValueRedactorTests at the original commit"
condition = "AND"
commits = ["547c7ddc7ef0b28fcc75039da67d41e51d59b4b5"]
targetRules = [
  "private-key",
  "generic-api-key",
  "github-pat",
  "stripe-access-token",
  "gitlab-pat",
  "jwt"
]
paths = ['''backend/tests/SmartClinic\.Configuration\.Tests/AuditValueRedactorTests\.cs''']
regexTarget = "line"
regexes = [
  '''MIIEsecret''',
  '''sk_live_51Habc''',
  '''ghp_123456789012345678901234567890123456''',
  '''glpat-AbCdEfGhIjKlMnOpQrSt''',
  '''rk_live_AbCdEfGh1234''',
  '''eyJhbGciOiJub25lIn0\.eyJzdWIiOiJhZG1pbiJ9\.'''
]